    <script>
        function allowDrop(ev) {
            ev.preventDefault();
        }
        function drag(ev) {
            ev.dataTransfer.setData("text", ev.target.id);
        }
        function drop(ev) {
            ev.preventDefault();
            var data = ev.dataTransfer.getData("text");
            // If dropping on an empty square, append it. If dropping on an existing piece, replace it.
            if (ev.target.classList.contains('square')) {
                ev.target.appendChild(document.getElementById(data));
            } else if (ev.target.parentNode.classList.contains('square')) {
                var square = ev.target.parentNode;
                square.innerHTML = ''; // Capture/remove enemy piece
                square.appendChild(document.getElementById(data));
            }
        }
    </script>
